# macOS development override. Layered on top of docker-compose.yml via
# COMPOSE_FILE in .env — never used on the Debian target.
#
# Two jobs:
#
#   1. Strip what macOS cannot provide (/dev/dri, the render group, the
#      tailscaled socket) using Compose's !reset and !override merge tags.
#
#   2. Put /data on a named Docker volume by default, not a host bind mount. A
#      named volume lives on real ext4 inside Docker's Linux VM, so inodes, link
#      counts and PUID/PGID behave exactly as they will on the target. It is the
#      right default for testing the invariants.
#
#      Its one drawback is capacity: the volume lives inside Docker's VM disk
#      image on the Mac's internal drive, so real downloads fill the boot disk.
#      Set DEV_DATA_ROOT in .env to a host path to put /data on an external disk
#      instead — the source below switches between the two, because Compose
#      reads a value starting with "/" as a bind mount and anything else as a
#      named volume.
#
#      That path must be one filesystem and must support hardlinks, so APFS or
#      HFS+, never exFAT or FAT32. Verify with scripts/test-hardlinks.sh rather
#      than assuming: hardlinks and UID mapping do survive Docker Desktop's
#      VirtioFS, but that is a property of the current Docker Desktop, not a
#      guarantee, and it is the invariant most likely to be silently wrong.
#
# Either way every media service mounts the SAME source, so torrents/, usenet/
# and media/ share one filesystem exactly as spec §3.3 requires.

services:

  jellyfin:
    # No Intel iGPU here. Jellyfin falls back to software transcoding.
    devices: !reset []
    group_add: !reset []
    volumes: !override
      - jellyfin_config:/config
      - ${DEV_DATA_ROOT:-mediadata}:/data

  prowlarr:
    volumes: !override
      - prowlarr_config:/config

  sonarr:
    volumes: !override
      - sonarr_config:/config
      - ${DEV_DATA_ROOT:-mediadata}:/data

  radarr:
    volumes: !override
      - radarr_config:/config
      - ${DEV_DATA_ROOT:-mediadata}:/data

  bazarr:
    volumes: !override
      - bazarr_config:/config
      - ${DEV_DATA_ROOT:-mediadata}:/data

  qbittorrent:
    volumes: !override
      - qbittorrent_config:/config
      - ${DEV_DATA_ROOT:-mediadata}:/data

  sabnzbd:
    volumes: !override
      - sabnzbd_config:/config
      - ${DEV_DATA_ROOT:-mediadata}:/data

  jellyseerr:
    volumes: !override
      - jellyseerr_config:/app/config

  recyclarr:
    volumes: !override
      - recyclarr_config:/config
      - ./config/recyclarr/recyclarr.yml:/config/recyclarr.yml:ro

  caddy:
    # Drops the tailscaled socket mount and swaps in the dev Caddyfile, which
    # adds the `local_certs` global so Caddy issues from its own internal CA.
    # Routes themselves come from the same sites.caddy as production.
    volumes: !override
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./caddy/sites.caddy:/etc/caddy/sites.caddy:ro
      - ./caddy/site:/srv/site:ro
      - caddy_data:/caddydata
      - caddy_config:/config
      - caddy_logs:/var/log/caddy

volumes:
  # The media root. Shared by every media-touching service — one volume is
  # what makes hardlinks between torrents/ and media/ possible.
  mediadata:
  jellyfin_config:
  prowlarr_config:
  sonarr_config:
  radarr_config:
  bazarr_config:
  qbittorrent_config:
  sabnzbd_config:
  jellyseerr_config:
  recyclarr_config:
  caddy_data:
  caddy_config:
  caddy_logs:

# The stack for the Debian target. This file alone is the complete spec §4
# deployment — `docker compose up -d` needs no flags and no override files.
#
# There is one machine and one compose file. Everything that differs between
# installations comes from .env; nothing host-specific is written down here.

name: mediaserver

# LinuxServer images share the same PUID/PGID/TZ contract. These must match the
# `media` user that owns the media tree, or imports fail on permissions.
x-env: &env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Africa/Johannesburg}

# The OS, Docker and every app database live on one 500 GB SSD. Docker's default
# json-file driver has no size limit, so a container that starts logging in a
# loop fills that disk and takes the whole stack down with it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The LinuxServer images start as root to drop to PUID/PGID, so they cannot run
# with a dropped capability set. no-new-privileges is compatible with that —
# it blocks setuid escalation *after* the drop, which is the part that matters.
x-security: &security
  - no-new-privileges:true

# BIND_ADDR is required rather than defaulted, and deliberately has no fallback.
# A default of 0.0.0.0 fails *open*: delete the variable from .env and the whole
# stack silently publishes on every interface. Requiring it forces the decision
# to be made explicitly, the same way CADDY_BIND_ADDR already does.
#
#   127.0.0.1   loopback only — use this until every first-run wizard is done
#   0.0.0.0     every interface, i.e. the LAN (spec §5.1, decisions.md D1)
#   <lan-ip>    the LAN interface only
#
# Note that UFW does not filter these. Docker publishes bypass the INPUT chain,
# so what actually keeps them off the internet is the absence of a router port
# forward, plus the DOCKER-USER rules setup.sh installs. See decisions.md D19.

services:

  # ── Media server ───────────────────────────────────────────────────────────
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      <<: *env
    # Quick Sync passthrough. RENDER_GID is required rather than defaulted: a
    # wrong GID silently falls back to software transcoding (spec §4.2).
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?RENDER_GID is unset. Run: getent group render}"
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/jellyfin:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${JELLYFIN_PORT:-8096}:8096"

  # ── Indexers ───────────────────────────────────────────────────────────────
  # No /data mount: Prowlarr only brokers indexer definitions to the *arr apps.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    # /ping is unauthenticated by design in the *arrs, which is exactly what a
    # healthcheck needs — no API key baked into the compose file.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
      # Pinning the key makes it known before first start, which is what lets
      # scripts/provision.sh configure the stack without scraping config.xml.
      # Applied at runtime; never written to config.xml.
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY:-}
      # Auth is pinned here, not left to the first-run wizard. These are
      # re-applied on every container start, so an accidental UI flip to
      # DisabledForLocalAddresses reverts on the next restart instead of
      # silently persisting — which matters because Caddy reaches the backends
      # over the compose bridge, so every proxied request has a private source
      # address and would bypass that setting. Credentials are not here: the
      # *arrs keep those in their database, so provision.sh sets them by API.
      PROWLARR__AUTH__METHOD: ${ARR_AUTH_METHOD:-Forms}
      PROWLARR__AUTH__REQUIRED: ${ARR_AUTH_REQUIRED:-Enabled}
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/prowlarr:/config
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${PROWLARR_PORT:-9696}:9696"

  # ── TV and anime ───────────────────────────────────────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:-}
      # See the note on prowlarr — auth is pinned, not wizard-configured.
      SONARR__AUTH__METHOD: ${ARR_AUTH_METHOD:-Forms}
      SONARR__AUTH__REQUIRED: ${ARR_AUTH_REQUIRED:-Enabled}
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/sonarr:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${SONARR_PORT:-8989}:8989"

  # ── Films ──────────────────────────────────────────────────────────────────
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:-}
      # See the note on prowlarr — auth is pinned, not wizard-configured.
      RADARR__AUTH__METHOD: ${ARR_AUTH_METHOD:-Forms}
      RADARR__AUTH__REQUIRED: ${ARR_AUTH_REQUIRED:-Enabled}
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/radarr:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${RADARR_PORT:-7878}:7878"

  # ── Subtitles ──────────────────────────────────────────────────────────────
  # Needs /data: it writes subtitle files alongside the media.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/bazarr:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${BAZARR_PORT:-6767}:6767"

  # ── Download client ────────────────────────────────────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    # 403 is the healthy answer here — it means the Web UI is up and refusing an
    # unauthenticated request. Only a connection failure is unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/api/v2/app/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/qbittorrent:/config
      - ${DATA_ROOT:-/data}:/data
    # Moves onto gluetun when the VPN is enabled — see the block at the bottom.
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${QBIT_PORT:-8080}:8080"
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${QBIT_TORRENT_PORT:-6881}:6881/tcp"
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${QBIT_TORRENT_PORT:-6881}:6881/udp"

  # ── Usenet download client ─────────────────────────────────────────────────
  # Runs alongside qBittorrent, not instead of it. The *arrs speak both
  # protocols and choose per release. Usenet carries TV and film well; anime
  # coverage on Usenet is poor, so that stays on qBittorrent and Nyaa.
  #
  # Downloads land in /data/usenet/, a sibling of torrents/ and media/ on the
  # same filesystem, so imports hardlink exactly as torrent ones do (spec §3.3).
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/sabnzbd:/config
      - ${DATA_ROOT:-/data}:/data
    # Container port is 8080, same as qBittorrent's — no clash, they are
    # separate network namespaces. Only the host-side port has to differ.
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${SAB_PORT:-8085}:8080"

  # ── Download cleanup ───────────────────────────────────────────────────────
  # Removes malware, stalled and unlinked downloads from the queue, and tells the
  # *arrs to search again for what it removed. Closes part of what decisions.md
  # D27 records as knowingly unguarded on the temporary 2 TB disk.
  #
  # It cleans qBittorrent only — it has no SABnzbd support. Since D14 gives
  # SABnzbd download-client priority 1, the queue carrying most TV and film is
  # NOT covered by this. That asymmetry is accepted, not overlooked (D30).
  #
  # Not a LinuxServer image, so it does not get the PUID/PGID contract by way of
  # s6 — it implements the same variable names itself. There is no LinuxServer
  # build to prefer (D30), which is why the convention in CLAUDE.md is bent here.
  #
  # Needs /data for the same reason Bazarr does: the unlinked-download cleaner
  # counts hardlinks on the files themselves, so it has to see the identical tree
  # every other container sees (invariant 1).
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11011/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
      PORT: 11011
      UMASK: "022"
      # Empty rather than absent. It is a reverse-proxy path prefix and nothing
      # proxies this app; leaving it unset is the same result by accident.
      BASE_PATH: ""
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/cleanuparr:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${CLEANUPARR_PORT:-11011}:11011"
    # It polls the download client and the *arrs and does nothing else, so it is
    # useless until they answer — and its first act on a dead API is to log an
    # error every cycle. Gate it rather than let it start into a wall of them.
    depends_on:
      qbittorrent:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy

  # ── Requests ───────────────────────────────────────────────────────────────
  # The household front door. Search, discover, and request — requests flow
  # into Radarr and Sonarr automatically, and users sign in with their existing
  # Jellyfin accounts. This is what keeps everyone else out of the *arr UIs.
  #
  # No /data mount: it only ever talks to APIs, never to media files.
  #
  # ── The image is seerr, and the service is still called jellyseerr ──────────
  #
  # Jellyseerr was renamed to seerr. `fallenbagel/jellyseerr:latest` stopped
  # being published in August 2025 and a path-traversal-to-RCE in the image proxy
  # was patched upstream in v3.4.0 — so :latest sat twelve months stale on the
  # household-facing route without ever failing loudly. That is D7's one known
  # counter-example, since that convention assumes the tag keeps moving
  # (decisions.md D37).
  #
  # The service, container and ${CONFIG_ROOT} directory keep the old name on
  # purpose. Renaming the directory means moving it on the box by hand, and a
  # missed `mv` gives a FRESH seerr with an open setup wizard on the front door —
  # the D18 bootstrap hole, self-inflicted. Upstream migrates the database in
  # place on first start, so leaving the path alone is the whole migration.
  #
  # This gets renamed on the 10 TB rebuild, not before: D27 replaces the disk by
  # rebuilding from this repo rather than migrating, so there is nothing to move
  # and the hazard above does not exist. Do not do it piecemeal on the live box.
  #
  # Two things the image changed that are not visible here:
  #
  #   - It declares `USER node:node`, so it runs as UID 1000 and no longer as
  #     root. ${CONFIG_ROOT}/jellyseerr has to be owned by 1000 or the container
  #     crashes on a permission denied it cannot recover from. That is upstream's
  #     fixed UID, not PUID — do not add `user:` here to reconcile it with the
  #     rest of the stack, because the image's own files are node-owned.
  #   - It no longer ships an init process, hence `init: true`. Without it a
  #     crashed child is never reaped and the container accumulates zombies.
  #
  # The healthcheck still uses wget rather than curl: the base is node:alpine,
  # so busybox wget is present and curl is not.
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: jellyseerr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      TZ: ${TZ:-Africa/Johannesburg}
      LOG_LEVEL: info
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/jellyseerr:/app/config
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${SEERR_PORT:-5055}:5055"
    # Seerr reads libraries from Jellyfin and pushes requests into the *arrs, so
    # it wants them answering, not merely started.
    depends_on:
      jellyfin:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy

  # ── Quality profile sync ───────────────────────────────────────────────────
  # Pulls Trash Guides profiles and anime release-group scores into Sonarr and
  # Radarr on a schedule (spec §8). Talks to their APIs only — no /data.
  recyclarr:
    # Pinned to a major, not :latest — Recyclarr publishes no `latest` tag at
    # all, on either registry, because the config file format changes across
    # majors. An unpinned reference here does not degrade, it 404s the pull and
    # takes the whole `docker compose up` with it.
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      TZ: ${TZ:-Africa/Johannesburg}
      CRON_SCHEDULE: "@daily"
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
    volumes:
      # Mutable state (cache, cloned guide repo) on the SSD; the config itself
      # is version-controlled in this repo and mounted read-only over it.
      - ${CONFIG_ROOT:-/opt/mediaserver}/recyclarr:/config
      - ./config/recyclarr/recyclarr.yml:/config/recyclarr.yml:ro
    # A sync against a half-started Sonarr fails and then waits a whole day for
    # the next @daily run, so wait for them to actually answer.
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy

  # ── Reverse proxy ──────────────────────────────────────────────────────────
  # The public front door, and the only thing reachable from the internet. It
  # routes exactly three names — the landing page, Jellyfin and Seerr.
  #
  # The eight admin apps are routed too, but in a separate file: since D34 they
  # answer on their own names out of caddy/admin.caddy, behind a guard that 403s
  # any client outside RFC1918. sites.caddy holds what may be public, admin.caddy
  # holds what must not be (decisions.md D25, D30, D33, D34, spec §5.3).
  caddy:
    # Built, not pulled: DNS-01 needs the Cloudflare provider module compiled
    # in, because there is no inbound path for an HTTP-01 challenge on a
    # VPN-only box (caddy/Dockerfile, decisions.md D33). `image:` alongside
    # `build:` fixes the tag so validate.sh can reuse it.
    build:
      context: ./caddy
    image: mediaserver/caddy:latest
    container_name: caddy
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is unset, e.g. media.example.com}
      # Let's Encrypt expiry warnings. Required rather than defaulted: a silent
      # fallback to no contact address means no warning when renewal breaks.
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is unset — Let's Encrypt needs a contact address}
      # Which ACME directory to issue from. Point it at staging while proving
      # out DNS and the port forwards — production allows five failed
      # validations per hostname per hour, and the two things most likely to be
      # wrong (a missing port-80 forward, an unpropagated record) can only be
      # found by trying. Defaulted here rather than left to the Caddyfile's own
      # default so the variable is never present-but-empty, which would leave
      # `acme_ca` with no argument.
      CADDY_ACME_CA: ${CADDY_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      # Cloudflare API token for the DNS-01 challenge. Scoped to Zone:DNS:Edit
      # on this one zone — it can write TXT records and nothing else, so a leak
      # costs the zone's DNS, not the account. Required: without it Caddy starts
      # fine and then fails every renewal, which is a fault that surfaces sixty
      # days later rather than now.
      CF_API_TOKEN: ${CF_API_TOKEN:?CF_API_TOKEN is unset — Caddy needs it for the DNS-01 challenge}
      # Both of these are read by caddy/admin.caddy, to proxy the wg-easy UI.
      # wg-easy runs with host networking (D26), so it is the one upstream that
      # cannot be named by container: it has to be addressed at the box's own
      # LAN address and port.
      #
      # This block used to carry a port for every service, because the landing
      # page templated <lan-ip>:<port> into each Manage link. Since D34 the page
      # reads no environment at all — every link is a subdomain of whatever host
      # served the page, built client-side from data-sub — so those ten
      # variables were removed rather than left to rot. validate.sh checks the
      # remaining direction, that anything the page does read is set here.
      ADMIN_HOST: ${ADMIN_HOST:?ADMIN_HOST is unset — the LAN address of this box}
      WG_UI_PORT: ${WG_UI_PORT:-51821}
      # Relocated off Caddy's default /data. In this stack /data means the media
      # root in every container; having one container where it means something
      # else is exactly the ambiguity that causes mistakes later.
      XDG_DATA_HOME: /caddydata
    volumes:
      # The whole config DIRECTORY, not the three files inside it, and that is
      # load-bearing (decisions.md D39). A bind mount of a single file binds the
      # inode; `git pull` replaces files rather than editing them in place, so a
      # file mount keeps serving the version that existed when the container was
      # created — for as long as the container lives. `caddy reload` re-reads it
      # and finds the same stale bytes. A directory mount resolves the path on
      # every open, so a pulled change is visible immediately.
      #
      # Caddy looks for /etc/caddy/Caddyfile by default, and that file's own
      # `import` lines resolve relative to it, so sites.caddy and admin.caddy
      # are found without naming them here. A missing admin.caddy is not a soft
      # failure: the import means Caddy refuses to start rather than quietly
      # serving eight fewer names.
      - ./caddy/conf:/etc/caddy:ro
      # The landing page. Three static files served by the proxy that is already
      # running — no separate container, and no build step to run first.
      # A bind mount read per request, so edits here are live without a restart.
      - ./caddy/site:/srv/site:ro
      - ${CONFIG_ROOT:-/opt/mediaserver}/caddy/data:/caddydata
      - ${CONFIG_ROOT:-/opt/mediaserver}/caddy/config:/config
      # Access logs. Caddy is the only entry point from the internet, so without
      # this there is no record of who reached what. Also the input to the
      # fail2ban caddy-auth jail, so the format is load-bearing.
      - ${CONFIG_ROOT:-/opt/mediaserver}/caddy/logs:/var/log/caddy
      # Caddy holds no credential for anything but ACME. It once mounted a
      # tailscaled socket to fetch certificates, which meant an internet-facing
      # container held a VPN control API; nothing replaced that under wg-easy
      # and nothing should (review-2026-08 S7, decisions.md D21, D26).
    ports:
      # The LAN address the router forwards 80 and 443 to. A specific address,
      # never a wildcard — 0.0.0.0 here would collide with nothing today but
      # removes the one line of defence that survives a bad router rule.
      - "${CADDY_BIND_ADDR:?CADDY_BIND_ADDR is unset — the LAN address the router forwards to}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND_ADDR:?CADDY_BIND_ADDR is unset — the LAN address the router forwards to}:${CADDY_HTTPS_PORT:-443}:443"
    # Health-gated: started-but-not-listening backends make Caddy serve 502s for
    # the first minute after a reboot, which reads as a broken stack. Only the
    # two services it actually proxies.
    depends_on:
      jellyfin:
        condition: service_healthy
      jellyseerr:
        condition: service_healthy

  # ── Remote access ──────────────────────────────────────────────────────────
  # The administrator's door. Peers dial WG_PORT/udp from anywhere and land on
  # the LAN; the household never touches this and uses the public domain.
  #
  # Not to be confused with the Gluetun block below. That is an *outbound* VPN
  # client for qBittorrent's traffic and is still deferred. This is an inbound
  # remote-access server. They are unrelated and can coexist.
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    # Host networking, deliberately. wg0 is then a host interface, which buys
    # two things nothing else does: a peer reaches <lan-ip>:<port> by the same
    # address it uses at home, and setup.sh's firewall can match `-i wg0`
    # exactly as it used to match the tailnet. On a bridge network wg0 lives in
    # the container's namespace, peer traffic is masqueraded to the container's
    # own address, and neither holds (decisions.md D26).
    network_mode: host
    cap_add:
      # No SYS_MODULE. Upstream's reference compose adds it so the container can
      # modprobe wireguard; it also lets a container load arbitrary kernel
      # modules. The module is in-tree on Debian 13, so setup.sh loads it at
      # boot and this stays off. If wg0 never appears, add it back first.
      - NET_ADMIN
    environment:
      TZ: ${TZ:-Africa/Johannesburg}
      # The admin UI listener. A specific address, never a wildcard — same
      # reasoning as CADDY_BIND_ADDR. Still reachable from the tunnel: the LAN
      # address is local to the box whichever interface the packet arrived on.
      HOST: ${WG_UI_BIND:?WG_UI_BIND is unset — the LAN address of this box}
      PORT: ${WG_UI_PORT:-51821}
      # Plain HTTP, matching the other admin UIs: encrypted in transit by
      # WireGuard, plaintext on the LAN, which was already true under §5.1.
      # v15 refuses HTTP without this and serves a self-signed cert instead.
      INSECURE: "true"
      # Unattended setup. NOTE this applies on FIRST START ONLY — wg-easy v15
      # keeps its config in a database, so unlike the *arrs these are not
      # re-asserted on every start. audit-auth.sh is the compensating control
      # (decisions.md D26, CLAUDE.md invariant 5).
      #
      # Do NOT add PASSWORD or PASSWORD_HASH. Those are v14 variables and v15
      # refuses to start when it sees one, deliberately, to stop a v14 config
      # being silently upgraded. validate.sh asserts their absence.
      INIT_ENABLED: "true"
      INIT_USERNAME: ${WG_USER:?WG_USER is unset — the wg-easy admin username}
      INIT_PASSWORD: ${WG_PASS:?WG_PASS is unset — the wg-easy admin password}
      INIT_HOST: ${WG_HOST:?WG_HOST is unset — the name peers dial in on}
      INIT_PORT: ${WG_PORT:-51820}
      INIT_DNS: ${WG_DNS:-1.1.1.1}
      # v4 and v6 are one group in wg-easy and must be set together, which is
      # why a v6 range appears in an otherwise v4-only stack.
      INIT_IPV4_CIDR: ${WG_SUBNET:-10.8.0.0/24}
      INIT_IPV6_CIDR: ${WG_SUBNET6:-fdcc:ad94:bacf:61a3::/64}
      # Split tunnel: the LAN and the tunnel itself, nothing else. Ordinary
      # browsing stays off the tunnel, so a peer can leave WireGuard always-on
      # and home addresses simply resolve wherever they are.
      INIT_ALLOWED_IPS: ${LAN_SUBNET:?LAN_SUBNET is unset — wg peers need a route to the LAN},${WG_SUBNET:-10.8.0.0/24}
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    healthcheck:
      # Both halves, because they fail independently and the second one is the
      # half that matters here. This checked only `wg show wg0`, and on the
      # first real reboot wg-easy lost a race with dhcpcd: it threw
      # EADDRNOTAVAIL binding WG_UI_BIND, its web server died, wg-quick carried
      # on regardless, and the container sat there reporting healthy with no
      # admin interface at all. On a VPN-only box that is the remote front door
      # (decisions.md D36).
      #
      # The tunnel alone is not evidence the app is up, and the UI alone is not
      # evidence the tunnel is. Ask for both.
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1 && wget -q -O /dev/null http://${WG_UI_BIND:-127.0.0.1}:${WG_UI_PORT:-51821}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── VPN gateway — deferred, spec §7 ────────────────────────────────────────

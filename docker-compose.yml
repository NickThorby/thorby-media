# Production stack for the Debian target. This file alone is the complete
# spec §4 deployment — on the target, `docker compose up -d` needs no flags.
#
# The macOS dev box layers docker-compose.dev.yml on top via COMPOSE_FILE in
# .env. Production is deliberately the default: forgetting COMPOSE_FILE on
# Debian yields the correct stack, while forgetting it on the Mac fails loudly
# on the missing /dev/dri rather than silently disabling hardware transcoding.

name: mediaserver

# LinuxServer images share the same PUID/PGID/TZ contract. These must match the
# `media` user that owns the media tree, or imports fail on permissions.
x-env: &env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Africa/Johannesburg}

# The OS, Docker and every app database live on one 500 GB SSD. Docker's default
# json-file driver has no size limit, so a container that starts logging in a
# loop fills that disk and takes the whole stack down with it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The LinuxServer images start as root to drop to PUID/PGID, so they cannot run
# with a dropped capability set. no-new-privileges is compatible with that —
# it blocks setuid escalation *after* the drop, which is the part that matters.
x-security: &security
  - no-new-privileges:true

# BIND_ADDR is required rather than defaulted, and deliberately has no fallback.
# A default of 0.0.0.0 fails *open*: delete the variable from .env and the whole
# stack silently publishes on every interface. Requiring it forces the decision
# to be made explicitly, the same way CADDY_BIND_ADDR already does.
#
#   127.0.0.1   loopback only — use this until every first-run wizard is done
#   0.0.0.0     every interface, i.e. the LAN (spec §5.1, decisions.md D1)
#   <lan-ip>    the LAN interface only
#
# Note that UFW does not filter these. Docker publishes bypass the INPUT chain,
# so what actually keeps them off the internet is the absence of a router port
# forward, plus the DOCKER-USER rules setup.sh installs. See decisions.md D19.

services:

  # ── Media server ───────────────────────────────────────────────────────────
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      <<: *env
    # Quick Sync passthrough. RENDER_GID is required rather than defaulted: a
    # wrong GID silently falls back to software transcoding (spec §4.2).
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?RENDER_GID is unset. On the target run: getent group render. On the Mac, uncomment the MAC DEV block in .env}"
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/jellyfin:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${JELLYFIN_PORT:-8096}:8096"

  # ── Indexers ───────────────────────────────────────────────────────────────
  # No /data mount: Prowlarr only brokers indexer definitions to the *arr apps.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    # /ping is unauthenticated by design in the *arrs, which is exactly what a
    # healthcheck needs — no API key baked into the compose file.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
      # Pinning the key makes it known before first start, which is what lets
      # scripts/provision.sh configure the stack without scraping config.xml.
      # Applied at runtime; never written to config.xml.
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY:-}
      # Auth is pinned here, not left to the first-run wizard. These are
      # re-applied on every container start, so an accidental UI flip to
      # DisabledForLocalAddresses reverts on the next restart instead of
      # silently persisting — which matters because Caddy reaches the backends
      # over the compose bridge, so every proxied request has a private source
      # address and would bypass that setting. Credentials are not here: the
      # *arrs keep those in their database, so provision.sh sets them by API.
      PROWLARR__AUTH__METHOD: ${ARR_AUTH_METHOD:-Forms}
      PROWLARR__AUTH__REQUIRED: ${ARR_AUTH_REQUIRED:-Enabled}
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/prowlarr:/config
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${PROWLARR_PORT:-9696}:9696"

  # ── TV and anime ───────────────────────────────────────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:-}
      # See the note on prowlarr — auth is pinned, not wizard-configured.
      SONARR__AUTH__METHOD: ${ARR_AUTH_METHOD:-Forms}
      SONARR__AUTH__REQUIRED: ${ARR_AUTH_REQUIRED:-Enabled}
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/sonarr:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${SONARR_PORT:-8989}:8989"

  # ── Films ──────────────────────────────────────────────────────────────────
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:-}
      # See the note on prowlarr — auth is pinned, not wizard-configured.
      RADARR__AUTH__METHOD: ${ARR_AUTH_METHOD:-Forms}
      RADARR__AUTH__REQUIRED: ${ARR_AUTH_REQUIRED:-Enabled}
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/radarr:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${RADARR_PORT:-7878}:7878"

  # ── Subtitles ──────────────────────────────────────────────────────────────
  # Needs /data: it writes subtitle files alongside the media.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/bazarr:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${BAZARR_PORT:-6767}:6767"

  # ── Download client ────────────────────────────────────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    # 403 is the healthy answer here — it means the Web UI is up and refusing an
    # unauthenticated request. Only a connection failure is unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/api/v2/app/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/qbittorrent:/config
      - ${DATA_ROOT:-/data}:/data
    # Moves onto gluetun when the VPN is enabled — see the block at the bottom.
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${QBIT_PORT:-8080}:8080"
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${QBIT_TORRENT_PORT:-6881}:6881/tcp"
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${QBIT_TORRENT_PORT:-6881}:6881/udp"

  # ── Usenet download client ─────────────────────────────────────────────────
  # Runs alongside qBittorrent, not instead of it. The *arrs speak both
  # protocols and choose per release. Usenet carries TV and film well; anime
  # coverage on Usenet is poor, so that stays on qBittorrent and Nyaa.
  #
  # Downloads land in /data/usenet/, a sibling of torrents/ and media/ on the
  # same filesystem, so imports hardlink exactly as torrent ones do (spec §3.3).
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      <<: *env
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/sabnzbd:/config
      - ${DATA_ROOT:-/data}:/data
    # Container port is 8080, same as qBittorrent's — no clash, they are
    # separate network namespaces. Only the host-side port has to differ.
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${SAB_PORT:-8085}:8080"

  # ── Requests ───────────────────────────────────────────────────────────────
  # The household front door. Search, discover, and request — requests flow
  # into Radarr and Sonarr automatically, and users sign in with their existing
  # Jellyfin accounts. This is what keeps everyone else out of the *arr UIs.
  #
  # No /data mount: it only ever talks to APIs, never to media files.
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      TZ: ${TZ:-Africa/Johannesburg}
      LOG_LEVEL: info
    volumes:
      - ${CONFIG_ROOT:-/opt/mediaserver}/jellyseerr:/app/config
    ports:
      - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${SEERR_PORT:-5055}:5055"
    # Jellyseerr reads libraries from Jellyfin and pushes requests into the
    # *arrs, so it wants them answering, not merely started.
    depends_on:
      jellyfin:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy

  # ── Quality profile sync ───────────────────────────────────────────────────
  # Pulls Trash Guides profiles and anime release-group scores into Sonarr and
  # Radarr on a schedule (spec §8). Talks to their APIs only — no /data.
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      TZ: ${TZ:-Africa/Johannesburg}
      CRON_SCHEDULE: "@daily"
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
    volumes:
      # Mutable state (cache, cloned guide repo) on the SSD; the config itself
      # is version-controlled in this repo and mounted read-only over it.
      - ${CONFIG_ROOT:-/opt/mediaserver}/recyclarr:/config
      - ./config/recyclarr/recyclarr.yml:/config/recyclarr.yml:ro
    # A sync against a half-started Sonarr fails and then waits a whole day for
    # the next @daily run, so wait for them to actually answer.
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy

  # ── Reverse proxy ──────────────────────────────────────────────────────────
  # The public front door, and the only thing reachable from the internet. It
  # routes exactly three names — the landing page, Jellyfin and Jellyseerr.
  #
  # The six admin apps are NOT proxied. They are reached at <lan-ip>:<port>, on
  # the LAN or over Tailscale, so there is no public route to them to get wrong
  # (decisions.md D25, spec §5.3).
  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    logging: *logging
    security_opt: *security
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is unset, e.g. media.example.com}
      # Let's Encrypt expiry warnings. Required rather than defaulted: a silent
      # fallback to no contact address means no warning when renewal breaks.
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is unset — Let's Encrypt needs a contact address}
      # The address the Manage links point at, and the ports they use. Templated
      # into the landing page at request time so .env stays the only place a
      # host port is written down.
      ADMIN_HOST: ${ADMIN_HOST:?ADMIN_HOST is unset — the LAN address of this box}
      SONARR_PORT: ${SONARR_PORT:-8989}
      RADARR_PORT: ${RADARR_PORT:-7878}
      PROWLARR_PORT: ${PROWLARR_PORT:-9696}
      BAZARR_PORT: ${BAZARR_PORT:-6767}
      SAB_PORT: ${SAB_PORT:-8085}
      QBIT_PORT: ${QBIT_PORT:-8080}
      # Relocated off Caddy's default /data. In this stack /data means the media
      # root in every container; having one container where it means something
      # else is exactly the ambiguity that causes mistakes later.
      XDG_DATA_HOME: /caddydata
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites.caddy:/etc/caddy/sites.caddy:ro
      # The landing page. Three static files served by the proxy that is already
      # running — no separate container, and no build step to run first.
      # A bind mount read per request, so edits here are live without a restart.
      - ./caddy/site:/srv/site:ro
      - ${CONFIG_ROOT:-/opt/mediaserver}/caddy/data:/caddydata
      - ${CONFIG_ROOT:-/opt/mediaserver}/caddy/config:/config
      # Access logs. Caddy is the only entry point from the internet, so without
      # this there is no record of who reached what. Also the input to the
      # fail2ban caddy-auth jail, so the format is load-bearing.
      - ${CONFIG_ROOT:-/opt/mediaserver}/caddy/logs:/var/log/caddy
      # No tailscaled socket. It existed only to fetch *.ts.net certificates;
      # those are gone, and with them the accepted risk that a Caddy compromise
      # reached the tailnet control API (review-2026-08 S7, decisions.md D21).
    ports:
      # The LAN address the router forwards 80 and 443 to. A specific address,
      # never a wildcard — 0.0.0.0 here would collide with nothing today but
      # removes the one line of defence that survives a bad router rule.
      - "${CADDY_BIND_ADDR:?CADDY_BIND_ADDR is unset — the LAN address the router forwards to}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND_ADDR:?CADDY_BIND_ADDR is unset — the LAN address the router forwards to}:${CADDY_HTTPS_PORT:-443}:443"
    # Health-gated: started-but-not-listening backends make Caddy serve 502s for
    # the first minute after a reboot, which reads as a broken stack. Only the
    # two services it actually proxies.
    depends_on:
      jellyfin:
        condition: service_healthy
      jellyseerr:
        condition: service_healthy

  # ── VPN gateway — deferred, spec §7 ────────────────────────────────────────
  # Commented out until a provider with working port forwarding is chosen.
  # Port forwarding is the deciding feature; without it inbound peers fail and
  # seeding degrades badly. Mullvad and IVPN have both dropped it and are
  # unsuitable here. Candidates: Proton VPN Plus (NAT-PMP, Gluetun can
  # auto-configure qBittorrent's listening port), AirVPN, PIA.
  #
  # To enable:
  #   1. Uncomment this service and fill in the provider credentials
  #   2. Add to qbittorrent:  network_mode: "service:gluetun"
  #   3. Delete qbittorrent's `ports:` block — a container using another
  #      container's network stack cannot publish its own ports
  #   4. Move those three published ports onto gluetun below
  #   5. Set the forwarded port as qBittorrent's listening port
  #
  # gluetun:
  #   image: qmcgaw/gluetun:latest
  #   container_name: gluetun
  #   restart: unless-stopped
  #   cap_add:
  #     - NET_ADMIN
  #   devices:
  #     - /dev/net/tun:/dev/net/tun
  #   environment:
  #     TZ: ${TZ:-Africa/Johannesburg}
  #     VPN_SERVICE_PROVIDER: ${VPN_PROVIDER:-}
  #     VPN_TYPE: wireguard
  #     WIREGUARD_PRIVATE_KEY: ${VPN_PRIVATE_KEY:-}
  #     WIREGUARD_ADDRESSES: ${VPN_ADDRESSES:-}
  #     SERVER_COUNTRIES: ${VPN_COUNTRIES:-}
  #     VPN_PORT_FORWARDING: "on"
  #   volumes:
  #     - ${CONFIG_ROOT:-/opt/mediaserver}/gluetun:/gluetun
  #   ports:
  #     - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${QBIT_PORT:-8080}:8080"
  #     - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${QBIT_TORRENT_PORT:-6881}:6881/tcp"
  #     - "${BIND_ADDR:?BIND_ADDR is unset in .env — see the note above the services block}:${QBIT_TORRENT_PORT:-6881}:6881/udp"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Thorby Media</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>">
</head>
<body>

<main>
  <header class="head">
    <h1>Thorby Media</h1>
    <p class="sub">Everything in one place</p>
  </header>

  <!-- The two tiles anyone in the house needs. Watch, or ask for something new. -->
  <nav class="tiles" aria-label="Main">
    <a class="tile tile--watch" data-sub="jellyfin" href="#">
      <span class="tile__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 15.5z"/>
          <path d="M10 8.8v4.4l4-2.2z" fill="currentColor" stroke="none"/>
          <path d="M8 21h8"/>
        </svg>
      </span>
      <span class="tile__text">
        <span class="tile__title">Watch</span>
        <span class="tile__desc">Films, TV and anime we already have</span>
      </span>
      <span class="tile__arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13m-5-6 6 6-6 6"/></svg>
      </span>
    </a>

    <a class="tile tile--request" data-sub="seerr" href="#">
      <span class="tile__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="6.5"/>
          <path d="M20 20l-4.2-4.2"/>
          <path d="M11 8.4v5.2M8.4 11h5.2"/>
        </svg>
      </span>
      <span class="tile__text">
        <span class="tile__title">Request</span>
        <span class="tile__desc">Ask for something new — it downloads itself</span>
      </span>
      <span class="tile__arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13m-5-6 6 6-6 6"/></svg>
      </span>
    </a>
  </nav>

  <!-- Admin tools. Collapsed on purpose: nobody but the administrator needs
       these, and an open list of six unfamiliar names is exactly what makes a
       page like this intimidating. -->
  <details class="manage">
    <summary>
      <span class="manage__label">Manage</span>
      <span class="manage__chev" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </span>
    </summary>
    <div class="admin">
      <a class="chip" data-sub="sonarr"   href="#"><span class="chip__dot" data-c="1"></span>Sonarr<em>TV &amp; anime</em></a>
      <a class="chip" data-sub="radarr"   href="#"><span class="chip__dot" data-c="2"></span>Radarr<em>Films</em></a>
      <a class="chip" data-sub="prowlarr" href="#"><span class="chip__dot" data-c="3"></span>Prowlarr<em>Indexers</em></a>
      <a class="chip" data-sub="bazarr"   href="#"><span class="chip__dot" data-c="4"></span>Bazarr<em>Subtitles</em></a>
      <a class="chip" data-sub="sab"      href="#"><span class="chip__dot" data-c="5"></span>SABnzbd<em>Usenet</em></a>
      <a class="chip" data-sub="qbit"     href="#"><span class="chip__dot" data-c="6"></span>qBittorrent<em>Torrents</em></a>
    </div>
  </details>
</main>

<script>
  // Links are built from the current host rather than hardcoded, so this one
  // file works unchanged at mediabox.ts.net and at localhost:8443 — the port
  // comes along for free, which a server-side template using CADDY_DOMAIN
  // would lose.
  for (const el of document.querySelectorAll('[data-sub]')) {
    el.href = `${location.protocol}//${el.dataset.sub}.${location.host}`;
  }
</script>

</body>
</html>
